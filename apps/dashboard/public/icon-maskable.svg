<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="zapGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#44d5a4"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Full-bleed background for maskable / Apple touch icon -->
  <rect width="512" height="512" fill="url(#bgMask)"/>
  
  <!-- Center elements within safe-zone (400x400 safe diameter) -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 8" opacity="0.4"/>

  <!-- Live beacon dot in safe area -->
  <circle cx="370" cy="140" r="14" fill="#44d5a4" opacity="0.25"/>
  <circle cx="370" cy="140" r="9" fill="#44d5a4"/>

  <!-- Centered Zap Icon in Safe Zone -->
  <g filter="url(#glowMask)" transform="translate(16, 8) scale(0.94)">
    <path d="M284 64 L134 296 H254 L232 448 L382 216 H262 L284 64 Z" fill="url(#zapGradMask)"/>
  </g>
</svg>
