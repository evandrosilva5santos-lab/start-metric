<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="zapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#44d5a4"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#1f293d" stroke-width="4"/>
  
  <!-- Subtle circular grid / radar accent -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 8" opacity="0.4"/>
  <circle cx="256" cy="256" r="100" fill="none" stroke="#1e293b" stroke-width="2" opacity="0.3"/>

  <!-- Live beacon dot top right -->
  <circle cx="410" cy="102" r="16" fill="#44d5a4" opacity="0.25"/>
  <circle cx="410" cy="102" r="10" fill="#44d5a4"/>

  <!-- Main Zap Icon with Glow -->
  <g filter="url(#glow)">
    <path d="M284 56 L124 300 H252 L228 456 L388 212 H260 L284 56 Z" fill="url(#zapGrad)"/>
  </g>
</svg>
